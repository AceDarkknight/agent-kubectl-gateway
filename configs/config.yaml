server:
  port: 8078
  host: "0.0.0.0"
  tls_cert: ""
  tls_key: ""

# 认证配置
auth:
  token: ""

audit:
  log_file: "./log/audit.log"
  audit_file: "./log/audit_detail.log"
  level: "info"
  format: "json"
  max_size_mb: 100
  max_backups: 30
  max_age_days: 30
  compress: true

execution:
  max_output_length: 10000
  timeout_seconds: 30
  max_concurrent: 10

rules:
  # 动词白名单：允许执行的 kubectl 操作动词
  # 注意：白名单优先级高于黑名单，如果配置了白名单，则只允许白名单中的动词
  verb_allowlist:
    - "get"
    - "describe"
    - "logs"
    - "apply"
    - "create"
    - "patch"
    - "rollout"
    - "scale"
    - "top"

  # 动词黑名单：禁止执行的 kubectl 操作动词
  # 注意：黑名单仅在未配置白名单时生效
  verb_blocklist:
    - "delete"
    - "exec"
    - "port-forward"

  # 脱敏规则：对特定资源的输出进行脱敏
  masking:
    - resource: "secrets"
      namespaces: ["*"]
      action: "mask"

    # 字段过滤规则：移除特定的 JSONPath/YAML 字段
    - resource: "*"
      namespaces: ["*"]
      action: "filter_fields"
      fields:
        - "metadata.annotations.kubectl.kubernetes.io/last-applied-configuration"
        - "metadata.managedFields"
        - "metadata.creationTimestamp"
        - "metadata.generateName"
        - "metadata.ownerReferences"
        - "metadata.resourceVersion"
        - "metadata.uid"
        - "status"
      description: "过滤掉 kubectl 注解、managedFields、creationTimestamp、generateName、ownerReferences、resourceVersion、uid 和 status 字段，减小返回体积"

    # 默认值裁剪规则：按资源显式配置，避免配置语义过宽
    - resource: "pod"
      namespaces: ["*"]
      action: "strip_defaults"
      description: "裁剪 Pod 中的已知默认值（restartPolicy、dnsPolicy、imagePullPolicy 等），不裁剪 admission 注入的 tolerations"

    - resource: "pods"
      namespaces: ["*"]
      action: "strip_defaults"
      description: "裁剪 Pod 列表中的已知默认值（restartPolicy、dnsPolicy、imagePullPolicy 等），不裁剪 admission 注入的 tolerations"

    - resource: "deployment"
      namespaces: ["*"]
      action: "strip_defaults"
      description: "裁剪 Deployment 的 PodTemplateSpec 中已知默认值，不裁剪 admission 注入的 tolerations"

    - resource: "deployments"
      namespaces: ["*"]
      action: "strip_defaults"
      description: "裁剪 Deployment 列表的 PodTemplateSpec 中已知默认值，不裁剪 admission 注入的 tolerations"

    - resource: "statefulset"
      namespaces: ["*"]
      action: "strip_defaults"
      description: "裁剪 StatefulSet 的 PodTemplateSpec 中已知默认值，不裁剪 admission 注入的 tolerations"

    - resource: "statefulsets"
      namespaces: ["*"]
      action: "strip_defaults"
      description: "裁剪 StatefulSet 列表的 PodTemplateSpec 中已知默认值，不裁剪 admission 注入的 tolerations"

# 限流配置
rate_limit:
  requests_per_second: 10
  burst: 20
